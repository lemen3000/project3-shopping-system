# ========== 持久化配置 ==========
# 可选值：text / binary / excel / sqlite
persistence.type=excel

# ========== 日志配置 ==========
log.enable=true
log.file=shop.log

# ========== 邮件发件配置 ==========
mail.enable=true
mail.smtp.host=smtp.qq.com
mail.smtp.port=587
mail.sender=qiuchong6@qq.com
mail.auth.code=crxtstrqeljsbabj

# ========== 邮件下单（IMAP收信）配置 ==========
mail.imap.enable=true

mail.imap.host=imap.qq.com

mail.imap.port=993

mail.imap.ssl.enable=true
# 轮询间隔（毫秒），30000 = 每30秒检查一次
mail.order.poll.interval=30000
